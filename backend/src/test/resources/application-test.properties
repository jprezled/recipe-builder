# Test profile: a SEPARATE database from the one the app uses.
#
# Why separate: repository tests truncate tables to clean up after themselves.
# Pointed at recipe_builder_db that would wipe the favorites saved for a demo.
# recipe_builder_test_db exists only to be thrown away.
#
# Create it once per machine:
#   createdb recipe_builder_test_db
#   psql -d recipe_builder_test_db -f Database/migrations/V1__initial_schema.sql
#   psql -d recipe_builder_test_db -f Database/migrations/V2__demo_user.sql
spring.datasource.url=jdbc:postgresql://localhost:5432/recipe_builder_test_db
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
