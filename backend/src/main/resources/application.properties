spring.application.name=recipe-builder
server.port=8080

# ---------------------------------------------------------------------------
# .env
# ---------------------------------------------------------------------------
# Spring Boot does not read .env files on its own. This line imports the one at
# the repo root (one level up from backend/). "optional:" means the app still
# starts when the file is absent, which is what lets the tests run without it.
spring.config.import=optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Spoonacular
# ---------------------------------------------------------------------------
# NEVER put the real key here - this file is committed. It comes from .env or a
# real environment variable. The empty default lets the app boot without a key;
# the client then fails with a clear message instead of crashing at startup.
spoonacular.api-key=${SPOONACULAR_API_KEY:}
spoonacular.base-url=https://api.spoonacular.com

# ---------------------------------------------------------------------------
# Cache (RB-74)
# ---------------------------------------------------------------------------
# A repeated search is served from memory rather than spending another of our
# 150 daily Spoonacular points.
#
# expireAfterWrite=1h  - long enough to cover a work session, short enough that
#                        nobody debugs yesterday's results.
# maximumSize=200      - a few hundred bytes each, so the cache cannot grow
#                        without limit.
spring.cache.cache-names=recipeSearches
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=1h

# ---------------------------------------------------------------------------
# Postgres (sprint 2)
# ---------------------------------------------------------------------------
# Values come from the .env at the repo root, same as the Spoonacular key.
# The defaults after ":" point at a normal local install, so the DataSource
# bean can always be built - which is what lets the app start even when
# Postgres is not running. The pool does not open a connection until something
# actually asks for one, so search keeps working without a database.
#
# NO trailing whitespace after these values in .env. Spring keeps it.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recipe_builder_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Nothing in this application generates, alters or drops a table. The schema
# comes from Database/migrations, applied by hand. This line is a reminder,
# not a setting Spring needs.
# spring.jpa.* is deliberately absent - there is no JPA on the classpath.
